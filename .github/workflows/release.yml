name: Release

# A release is a tag: pushing vX.Y.Z tests the tree, builds macOS for
# Apple Silicon and Intel, Linux for amd64 and arm64, and Windows for
# amd64 and arm64, then creates or fills the draft release of that
# version. The draft is published only after every asset is uploaded.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the release, its assets and the uploads

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - &check-tag
        name: Check the tag against mygo.json
        run: |
          version="$(jq -r .version mygo.json)"
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "::error::the tag $GITHUB_REF_NAME does not match mygo.json's v$version"
            exit 1
          }
      - &seed-native
        name: Seed the native terminal library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # go test downloads libghostty-vt from GitHub's release CDN, which
          # answers 504 now and then; MyGo's own retries last a few seconds.
          # Fetch it here with patience, and through the API if the CDN keeps
          # failing, so the tests and the build find it already cached.
          set -euo pipefail
          go mod download github.com/egoist/mygo
          manifest="$(go list -m -f '{{.Dir}}' github.com/egoist/mygo)/plugins/terminal/mygo-plugin.json"
          case "$(go env GOOS)" in
            darwin) targets="darwin-arm64 darwin-amd64"; cache="$HOME/Library/Caches" ;;
            windows)
              targets="windows-amd64 windows-arm64"
              cache="${LOCALAPPDATA:-$HOME/AppData/Local}"
              cache="${cache//\\//}"
              ;;
            *) targets="linux-amd64 linux-arm64"; cache="${XDG_CACHE_HOME:-$HOME/.cache}" ;;
          esac
          pick() { jq -r --arg t "$1" '.libraries[] | select(.name=="libghostty-vt") | .files[$t].'"$2" "$manifest"; }
          for target in $targets; do
            url="$(pick "$target" url)"
            name="$(pick "$target" name)"
            sha="$(pick "$target" sha256)"
            dir="$cache/mygo/natives/$sha"
            mkdir -p "$dir"
            if [ ! -f "$dir/$name" ]; then
              curl -fsSL --retry 10 --retry-all-errors --retry-delay 10 --max-time 300 \
                -o "$dir/$name" "$url" || {
                tag="${url%/*}"; tag="${tag##*/}"
                file="${url##*/}"
                id="$(gh api "repos/egoist/mygo/releases/tags/$tag" \
                  | jq -r --arg n "$file" '.assets[] | select(.name==$n) | .id')"
                gh api -H 'Accept: application/octet-stream' \
                  "repos/egoist/mygo/releases/assets/$id" > "$dir/$name"
              }
            fi
            got="$(shasum -a 256 "$dir/$name" 2>/dev/null || sha256sum "$dir/$name")"
            test "${got%% *}" = "$sha" || { echo "::error::$name is not the expected file"; exit 1; }
            echo "cached $dir/$name"
          done
      - name: Test
        run: go test ./...
      - name: Build
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform darwin/arm64,darwin/amd64
      - name: Check the artifacts
        run: |
          version="$(jq -r .version mygo.json)"
          test -f "build/darwin-arm64/mojian-$version-arm64.dmg"
          test -f "build/darwin-amd64/mojian-$version-amd64.dmg"
          test -f "build/darwin-arm64/mojian-$version-darwin-arm64.tar.gz"
          test -f "build/darwin-amd64/mojian-$version-darwin-amd64.tar.gz"
          test -f "build/darwin-arm64/update-darwin-arm64.json"
          test -f "build/darwin-amd64/update-darwin-amd64.json"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            build/darwin-arm64/*.dmg
            build/darwin-amd64/*.dmg
            build/darwin-*/*-darwin-*.tar.gz
            build/darwin-*/update-*.json
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - *check-tag
      - *seed-native
      - name: Test
        run: go test ./...
      - name: Build
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform linux/amd64,linux/arm64
      - name: Name the RPMs like the other artifacts
        run: |
          # MyGo writes RPM files as name-version-release.arch.rpm, whose
          # release number the other artifacts do not have: rename them to
          # name-version-arch.rpm. The release stays in the RPM's metadata.
          version="$(jq -r .version mygo.json)"
          mv build/linux-amd64/mojian-"$version"-*.x86_64.rpm build/linux-amd64/mojian-"$version"-x86_64.rpm
          mv build/linux-arm64/mojian-"$version"-*.aarch64.rpm build/linux-arm64/mojian-"$version"-aarch64.rpm
      - name: Check the artifacts
        run: |
          version="$(jq -r .version mygo.json)"
          test -f "build/linux-amd64/mojian-$version-linux-amd64.tar.gz"
          test -f "build/linux-amd64/mojian_${version}_amd64.deb"
          test -f "build/linux-amd64/mojian-$version-x86_64.rpm"
          test -f "build/linux-arm64/mojian-$version-linux-arm64.tar.gz"
          test -f "build/linux-arm64/mojian_${version}_arm64.deb"
          test -f "build/linux-arm64/mojian-$version-aarch64.rpm"
          test -f "build/linux-amd64/update-linux-amd64.json"
          test -f "build/linux-arm64/update-linux-arm64.json"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            build/linux-amd64/*.tar.gz
            build/linux-amd64/*.deb
            build/linux-amd64/*.rpm
            build/linux-amd64/install.sh
            build/linux-amd64/update-*.json
            build/linux-arm64/*.tar.gz
            build/linux-arm64/*.deb
            build/linux-arm64/*.rpm
            build/linux-arm64/update-*.json
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Ensure jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            choco install jq -y --no-progress
            echo 'C:\ProgramData\chocolatey\bin' >> "$GITHUB_PATH"
          fi
      - *check-tag
      - *seed-native
      - name: Test
        run: go test ./...
      - name: Build
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform windows/amd64,windows/arm64
      - name: Check the artifacts
        run: |
          version="$(jq -r .version mygo.json)"
          for arch in amd64 arm64; do
            test -f "build/windows-$arch/mojian-$version-windows-$arch.tar.gz"
            test -f "build/windows-$arch/update-windows-$arch.json"
            test -f "build/windows-$arch/mojian-setup-$version-$arch.exe"
          done
          test -f build/windows-amd64/install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            build/windows-amd64/mojian-setup-*.exe
            build/windows-amd64/*.tar.gz
            build/windows-amd64/update-*.json
            build/windows-amd64/install.ps1
            build/windows-arm64/mojian-setup-*.exe
            build/windows-arm64/*.tar.gz
            build/windows-arm64/update-*.json
          if-no-files-found: error

  release:
    name: Publish
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: Flatten the artifacts
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -exec rm -rf {} +
      - name: Check the assets
        run: |
          version="$(jq -r .version mygo.json)"
          test -f "dist/mojian-$version-arm64.dmg"
          test -f "dist/mojian-$version-amd64.dmg"
          test -f "dist/mojian-$version-darwin-amd64.tar.gz"
          test -f "dist/mojian-$version-darwin-arm64.tar.gz"
          test -f "dist/update-darwin-amd64.json"
          test -f "dist/update-darwin-arm64.json"
          test -f "dist/mojian-$version-linux-amd64.tar.gz"
          test -f "dist/mojian-$version-linux-arm64.tar.gz"
          test -f "dist/mojian_${version}_amd64.deb"
          test -f "dist/mojian_${version}_arm64.deb"
          test -f "dist/mojian-$version-x86_64.rpm"
          test -f "dist/mojian-$version-aarch64.rpm"
          test -f "dist/update-linux-amd64.json"
          test -f "dist/update-linux-arm64.json"
          test -f "dist/install.sh"
          test -f "dist/mojian-$version-windows-amd64.tar.gz"
          test -f "dist/mojian-$version-windows-arm64.tar.gz"
          test -f "dist/mojian-setup-$version-amd64.exe"
          test -f "dist/mojian-setup-$version-arm64.exe"
          test -f "dist/update-windows-amd64.json"
          test -f "dist/update-windows-arm64.json"
          test -f "dist/install.ps1"
          ls -lh dist
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [ "$draft" != "true" ]; then
              echo "::error::$tag is published already: bump the version in mygo.json"
              exit 1
            fi
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$tag" --generate-notes
          fi
      - name: Upload the assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum *.dmg *.tar.gz *.deb *.rpm *.exe *.json install.sh install.ps1 > SHA256SUMS)
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/*.dmg dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.exe dist/*.json dist/install.sh dist/install.ps1 dist/SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
