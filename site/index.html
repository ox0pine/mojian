<meta name="description" content="Mojian 是一个安静的原生纯文本编辑器。文件夹就是项目，标签页是工作区：文本、图片、PDF、终端与 Git diff 同屏并排。没有数据库、账号、webview 或 cgo。支持 macOS、Linux 与 Windows。">

<script>
// The theme is chosen before the first paint, so the page never flashes the wrong one.
try {
  var saved = localStorage.getItem("mojian:theme");
  var dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.querySelector('meta[name="theme-color"]').content = dark ? "#0e0d0b" : "#fcfbf9";
} catch (e) {}
</script>
